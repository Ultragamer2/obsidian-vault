<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Synth-002 — Three Steps Flow</title><style>
body{background:#0f1115;color:#e6e1dc;font-family:system-ui,Segoe UI,sans-serif;margin:0;padding:40px;}
.container{max-width:720px;margin:0 auto;}
h1{font-size:1.6rem;margin-bottom:8px;color:#f0c070;letter-spacing:0.02em;}
.subtitle{color:#9aa0a6;font-size:0.9rem;margin-bottom:28px;}
.flow{display:flex;gap:12px;align-items:center;justify-content:center;margin:28px 0;flex-wrap:wrap;}
.box{border:2px solid #f0c070;border-radius:14px;padding:18px 22px;background:#171b22;min-width:140px;text-align:center;}
.box h3{margin:0 0 6px;font-size:1.05rem;color:#f0c070;}
.arrow{font-size:1.6rem;color:#f0c070;font-weight:700;}
.note{background:#171b22;border-left:4px solid #f0c070;padding:16px 18px;border-radius:0 10px 10px 0;color:#ccc;font-size:0.95rem;line-height:1.45;}
.footer{margin-top:30px;font-size:0.78rem;color:#6b7080;}
</style></head><body>
<div class="container">
<h1>Synth-002 — Three Steps Flow</h1><div class="subtitle">Inspired by Cal Newport 2007 · Not Cal · For Yago</div>
<svg width="640" height="160" viewBox="0 0 640 160" style="display:block;margin:0 auto 10px;">
<rect x="20" y="30" width="150" height="80" rx="14" fill="#171b22" stroke="#f0c070" stroke-width="2"/>
<text x="95" y="70" text-anchor="middle" fill="#f0c070" font-size="14" font-weight="700">Survey</text>
<text x="95" y="92" text-anchor="middle" fill="#ccc" font-size="11">Where am I?</text>
<polygon points="170,65 190,65 180,55" fill="#f0c070"/>
<rect x="210" y="30" width="150" height="80" rx="14" fill="#171b22" stroke="#f0c070" stroke-width="2"/>
<text x="285" y="70" text-anchor="middle" fill="#f0c070" font-size="14" font-weight="700">Select task</text>
<text x="285" y="92" text-anchor="middle" fill="#ccc" font-size="11">One step closer</text>
<polygon points="380,65 400,65 390,55" fill="#f0c070"/>
<rect x="420" y="30" width="150" height="80" rx="14" fill="#171b22" stroke="#f0c070" stroke-width="2"/>
<text x="495" y="70" text-anchor="middle" fill="#f0c070" font-size="14" font-weight="700">Habit plan</text>
<text x="495" y="92" text-anchor="middle" fill="#ccc" font-size="11">Small, scheduled</text>
<path d="M 95 120 Q 285 150 495 120" stroke="#6b7080" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
<text x="285" y="148" text-anchor="middle" fill="#6b7080" font-size="11">Repeat until done</text>
</svg>
<div class="note">
<strong>Loop, not ladder.</strong> Survey → one task → habit plan → repeat. Small consistent steps. Not one hero session.
</div>
<div class="footer">Cal Newport Study Hacks series · Synth-002 · Inbox→Plan→Calendar loop · Coach: name your one task</div>
</div>
</body></html>
